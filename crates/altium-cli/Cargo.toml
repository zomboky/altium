[package]
name = "altium-cli"
version.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "altium"
path = "src/main.rs"

[dependencies]
altium-core.workspace = true
altium-mcp.workspace = true
altium-server.workspace = true
anyhow = "1.0.104"
clap = { version = "4", features = ["derive"] }
dirs = "7.0.0"
dunce = "1.0.5"
opener = "0.8"
serde_json = "1.0.154"
tokio = { version = "1.54", features = ["rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
serde_json = "1.0.154"
tempfile = "3.27.0"
